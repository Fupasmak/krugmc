# Nginx для krugmc.ru. Кладётся в docker-compose как conf.d/default.conf.
# Перед первым запуском с HTTPS получи сертификат (см. README, раздел «Деплой»).

# Ограничение частоты запросов к API на уровне nginx (второй рубеж после Node)
limit_req_zone $binary_remote_addr zone=krug_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name krugmc.ru www.krugmc.ru;

    # Проверка домена для Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://krugmc.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.krugmc.ru;

    ssl_certificate     /etc/letsencrypt/live/krugmc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/krugmc.ru/privkey.pem;

    return 301 https://krugmc.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name krugmc.ru;

    ssl_certificate     /etc/letsencrypt/live/krugmc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/krugmc.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Видео до 200 МБ
    client_max_body_size 210m;
    client_body_timeout 300s;

    # Вложения раздаёт nginx напрямую: Node не занимается отдачей видео.
    location /uploads/ {
        alias /srv/uploads/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        # Файлы отдаются только как вложение/медиа, без выполнения в контексте сайта
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; sandbox" always;
    }

    location /api/ {
        limit_req zone=krug_api burst=20 nodelay;
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE-эндпоинты входа: буферизацию выключаем, иначе события копятся
        proxy_buffering off;
        proxy_read_timeout 360s;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
